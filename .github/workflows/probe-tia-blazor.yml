name: Probe TIA Blazor parameters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tia-blazor.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe hidden query parameters and websocket
        run: |
          python - <<'PY'
          import asyncio, base64, re
          from playwright.async_api import async_playwright

          BASE='https://tia.vietnamairport.vn/ArrDom'
          variants=[
            ('base',''),
            ('pageSize','?pageSize=100'),
            ('take','?take=100'),
            ('date','?date=2026-09-18'),
            ('flightDate','?flightDate=2026-09-18'),
            ('range','?from=00%3A00&to=23%3A59'),
          ]

          async def rows(page):
              out=[]
              for i in range(await page.locator('table:visible').count()):
                  rs=page.locator('table:visible').nth(i).locator('tbody tr')
                  for j in range(await rs.count()):
                      cells=[x.strip() for x in await rs.nth(j).locator('td').all_inner_texts()]
                      if len(cells)>=5 and cells[4]=='1':
                          out.append(cells)
              return out

          async def wait_rows(page):
              for _ in range(24):
                  r=await rows(page)
                  if r: return r
                  await page.wait_for_timeout(400)
              return []

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  ctx=await browser.new_context(locale='vi-VN',timezone_id='Asia/Ho_Chi_Minh',viewport={'width':1440,'height':1000})
                  for idx,(name,suffix) in enumerate(variants):
                      page=await ctx.new_page()
                      frames=[]
                      if idx==0:
                          cdp=await ctx.new_cdp_session(page)
                          await cdp.send('Network.enable')
                          def rec(ev,kind):
                              resp=ev.get('response',{})
                              data=resp.get('payloadData','')
                              opcode=resp.get('opcode')
                              if len(frames)<30:
                                  frames.append((kind,opcode,data[:1200]))
                          cdp.on('Network.webSocketFrameReceived',lambda ev:rec(ev,'RX'))
                          cdp.on('Network.webSocketFrameSent',lambda ev:rec(ev,'TX'))
                      await page.goto(BASE+suffix,wait_until='domcontentloaded',timeout=30000)
                      rr=await wait_rows(page)
                      print('VARIANT',name,'COUNT',len(rr),'FIRST',rr[0][:4] if rr else None,'LAST',rr[-1][:4] if rr else None,flush=True)
                      print('URL_FINAL',page.url,flush=True)
                      # Input/button hints
                      inputs=page.locator('input')
                      print('INPUTS',await inputs.count(),flush=True)
                      for k in range(min(await inputs.count(),20)):
                          el=inputs.nth(k)
                          print(' INPUT',k,await el.get_attribute('type'),await el.get_attribute('name'),await el.get_attribute('placeholder'),await el.get_attribute('value'),flush=True)
                      if idx==0:
                          await page.wait_for_timeout(2000)
                          for kind,opcode,data in frames:
                              printable=re.sub(r'[^\x20-\x7E]+',' ',data)
                              if any(k in printable.lower() for k in ['flight','page','date','arr','terminal','search','take','skip']):
                                  print('WS_HINT',kind,opcode,printable[:1000],flush=True)
                      await page.close()
                  await ctx.close(); await browser.close()

          asyncio.run(main())
          PY
