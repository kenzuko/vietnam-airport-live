name: Collect SGN live data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/collect-sgn.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: collect-sgn
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
          fetch-depth: 1

      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: data-live
          path: live
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Sync collector code
        run: |
          rm -rf live/scripts
          cp -R app/scripts live/scripts
          cp app/requirements.txt live/requirements.txt

      - name: Refresh SGN live data
        shell: bash
        working-directory: live
        run: |
          set -euo pipefail
          git config user.name 'vietnam-airport-live-bot'
          git config user.email 'actions@users.noreply.github.com'

          for cycle in 1 2 3; do
            echo "=== SGN refresh cycle ${cycle}/3 ==="
            python scripts/collect_sgn_fast.py
            python scripts/build_sgn_day.py

            python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path('data/sgn.json'), Path('data/sgn-day.json'), Path('data/history-index.json')]
          paths += list(Path('data/history').glob('*.json')) if Path('data/history').exists() else []
          for path in paths:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(data, dict):
                  if 'source' in data:
                      data['source'] = 'Live airport data'
                  data.pop('collector_notes', None)
                  for flight in data.get('flights', []):
                      if 'source' in flight:
                          flight['source'] = 'Live airport data'
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY

            git add data
            if git diff --cached --quiet; then
              echo 'No dataset change.'
            else
              git commit -m "data: refresh SGN live cycle ${cycle}"
              git push origin HEAD:data-live
            fi

            if [ "$cycle" -lt 3 ]; then
              sleep 55
            fi
          done
