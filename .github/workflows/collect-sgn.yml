name: Collect SGN live data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/collect-sgn.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: collect-sgn
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect official SGN data
        run: python scripts/collect_sgn.py

      - name: Sanitize public metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/sgn.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['source'] = 'Live airport data'
          for flight in data.get('flights', []):
              flight['source'] = 'Live airport data'
          path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          PY

      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- data/sgn.json; then
            echo 'No dataset change.'
            exit 0
          fi
          git config user.name 'vietnam-airport-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/sgn.json
          git commit -m 'data: refresh SGN live flights'
          git push
