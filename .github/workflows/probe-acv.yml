name: Probe ACV flight API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-acv.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe current ACV flight data paths
        shell: bash
        run: |
          python - <<'PY'
          import json, re, socket, time
          from urllib.parse import urljoin
          import requests

          S = requests.Session()
          S.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36",
              "Accept-Language": "vi-VN,vi;q=0.9,en;q=0.7",
          })

          def req(method, url, **kwargs):
              t=time.time()
              try:
                  r=S.request(method,url,timeout=(8,18),allow_redirects=True,**kwargs)
                  print(f"REQ {method} {url} -> {r.status_code} {len(r.content)}B {time.time()-t:.2f}s final={r.url}")
                  print("  content-type:", r.headers.get("content-type"))
                  return r
              except Exception as e:
                  print(f"REQ {method} {url} -> ERROR {type(e).__name__}: {e} ({time.time()-t:.2f}s)")
                  return None

          for host in ["acv.vn","www.acv.vn","tia.vietnamairport.vn","vietnamairport.vn"]:
              try:
                  print("DNS",host,socket.gethostbyname_ex(host))
              except Exception as e:
                  print("DNS",host,"ERROR",e)

          pages = [
              "https://acv.vn/vi/chuyen-bay",
              "https://acv.vn/tansonnhatairport/vi/thong-tin-chuyen-bay",
              "https://www.acv.vn/vi/chuyen-bay",
          ]
          htmls=[]
          for u in pages:
              r=req("GET",u,headers={"Accept":"text/html,application/xhtml+xml"})
              if r is not None and r.ok:
                  htmls.append((u,r.text))
                  print("  cookies:", list(S.cookies.get_dict().keys()))
                  for key in ["__NEXT_DATA__","/_next/","api/proxy","api/flights/search","flightDate","departureStation"]:
                      print("  contains",key, key in r.text)

          # Inspect Next.js/static JS references for API route clues.
          seen=set()
          for base,html in htmls:
              refs=re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''',html,re.I)
              for ref in refs[:80]:
                  u=urljoin(base,ref)
                  if u in seen: continue
                  seen.add(u)
                  r=req("GET",u)
                  if not r or not r.ok: continue
                  txt=r.text
                  hits=[x for x in ["api/flights/search","api/proxy","flightDate","departureStation","arrivalStation","pageSize","pageIndex"] if x in txt]
                  if hits:
                      print("JS_HIT",u,hits)
                      for pat in [r'.{0,160}/api/flights/search.{0,240}',r'.{0,160}/api/proxy.{0,240}',r'.{0,160}flightDate.{0,240}']:
                          m=re.search(pat,txt,re.S)
                          if m: print("  SNIP",re.sub(r'\s+',' ',m.group(0))[:700])

          # Bootstrap session if page reachable.
          boot=req("GET","https://acv.vn/vi/chuyen-bay?type=arrival&flightDate=2026-09-18&arrivalStation=SGN",
                   headers={"Accept":"text/html,application/xhtml+xml"})

          payloads=[]
          for terminal in ["T1","T2","T3",""]:
              for direction in ["arrival","departure"]:
                  body={
                      "flightDate":"2026-09-18","pageIndex":1,"pageSize":15,"langCode":"vi",
                      "terminal":terminal,"flightNo":"",
                      "departureStation":"SGN" if direction=="departure" else "",
                      "arrivalStation":"SGN" if direction=="arrival" else "",
                      "type":direction
                  }
                  payloads.append((terminal or "ALL",direction,body))

          for terminal,direction,body in payloads[:]:
              proxy={"url":"/api/flights/search","method":"POST","body":body}
              r=req("POST","https://acv.vn/api/proxy",json=proxy,headers={
                  "Accept":"*/*","Content-Type":"application/json","Origin":"https://acv.vn",
                  "Referer":"https://acv.vn/vi/chuyen-bay"
              })
              if r is not None:
                  print("PROXY",terminal,direction,"BODY",r.text[:800].replace("\n"," "))
              # only probe one direct path per direction for T1 to control load
              if terminal=="T1":
                  r2=req("POST","https://acv.vn/api/flights/search",json=body,headers={
                      "Accept":"application/json","Content-Type":"application/json","Referer":"https://acv.vn/vi/chuyen-bay"
                  })
                  if r2 is not None:
                      print("DIRECT",terminal,direction,"BODY",r2.text[:500].replace("\n"," "))

          # If proxy works, test pagination/pageSize behavior only once.
          body={"flightDate":"2026-09-18","pageIndex":1,"pageSize":100,"langCode":"vi","terminal":"T1","flightNo":"",
                "departureStation":"","arrivalStation":"SGN","type":"arrival"}
          r=req("POST","https://acv.vn/api/proxy",json={"url":"/api/flights/search","method":"POST","body":body},
                headers={"Accept":"*/*","Content-Type":"application/json","Origin":"https://acv.vn","Referer":"https://acv.vn/vi/chuyen-bay"})
          if r is not None:
              print("PAGESIZE100",r.text[:1200].replace("\n"," "))
          PY
