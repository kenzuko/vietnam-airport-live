name: Probe TIA pager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tia-pager.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect TIA grid pagination
        run: |
          sed -i 's/p.chromium.launch(headless=True)/p.chromium.launch(channel="chrome", headless=True)/' scripts/probe_tia_browser.py
          python scripts/probe_tia_browser.py
