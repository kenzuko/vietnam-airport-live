name: Probe TIA pager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tia-pager.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect TIA virtual scrolling
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def get_rows(page):
              out=[]
              tabs=page.locator('table:visible')
              for i in range(await tabs.count()):
                  trs=tabs.nth(i).locator('tbody tr')
                  for j in range(await trs.count()):
                      cells=[x.strip() for x in await trs.nth(j).locator('td').all_inner_texts()]
                      if len(cells)>=5 and cells[4]=='1':
                          out.append(cells)
              return out

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  ctx=await b.new_context(locale='vi-VN',timezone_id='Asia/Ho_Chi_Minh',viewport={'width':1440,'height':1000})
                  for direction,url in [('arrival','https://tia.vietnamairport.vn/ArrDom'),('departure','https://tia.vietnamairport.vn/DepDom')]:
                      page=await ctx.new_page()
                      await page.goto(url,wait_until='domcontentloaded',timeout=30000)
                      for _ in range(60):
                          rr=await get_rows(page)
                          if rr: break
                          await page.wait_for_timeout(500)
                      print('BASE',direction,'rows',len(rr),'first',rr[:1],'last',rr[-1:] if rr else [],flush=True)
                      table=page.locator('table:visible').first
                      if await table.count():
                          info=await table.evaluate("""el => {
                            const arr=[]; let n=el;
                            for(let i=0;n && i<8;i++,n=n.parentElement){
                              const s=getComputedStyle(n);
                              arr.push({tag:n.tagName,cls:n.className,id:n.id,clientHeight:n.clientHeight,scrollHeight:n.scrollHeight,clientWidth:n.clientWidth,scrollWidth:n.scrollWidth,overflowY:s.overflowY,role:n.getAttribute('role'),ariaRowCount:n.getAttribute('aria-rowcount')});
                            }
                            return arr;
                          }""")
                          print('ANCESTORS',direction,json.dumps(info,ensure_ascii=False),flush=True)
                          allinfo=await page.evaluate("""() => [...document.querySelectorAll('*')].map((n,i)=>{const s=getComputedStyle(n);return {i,tag:n.tagName,cls:n.className,id:n.id,ch:n.clientHeight,sh:n.scrollHeight,oy:s.overflowY}}).filter(x=>x.sh>x.ch+5 && x.ch>0).slice(0,50)""")
                          print('SCROLLABLE',direction,json.dumps(allinfo,ensure_ascii=False),flush=True)

                          seen={}
                          for r in rr: seen['|'.join(r[:5])]=r
                          candidates=page.locator('*').filter(has=table)
                          # Scroll every scrollable ancestor of the visible table.
                          handle=table
                          for level in range(7):
                              handle=handle.locator('..')
                              if await handle.count()==0: break
                              metrics=await handle.evaluate("el=>({ch:el.clientHeight,sh:el.scrollHeight})")
                              if metrics['sh']>metrics['ch']+5:
                                  print('TRY_SCROLL',direction,'level',level,metrics,flush=True)
                                  for frac in [0.25,0.5,0.75,1]:
                                      await handle.evaluate("(el,f)=>{el.scrollTop=(el.scrollHeight-el.clientHeight)*f}",frac)
                                      await page.wait_for_timeout(1200)
                                      nr=await get_rows(page)
                                      for r in nr: seen['|'.join(r[:5])]=r
                                      print(' SCROLL',frac,'visible',len(nr),'unique',len(seen),'first',nr[:1],'last',nr[-1:] if nr else [],flush=True)
                          # Also try wheel on table/grid area.
                          box=await table.bounding_box()
                          if box:
                              await page.mouse.move(box['x']+box['width']/2,box['y']+box['height']/2)
                              for k in range(8):
                                  await page.mouse.wheel(0,800)
                                  await page.wait_for_timeout(800)
                                  nr=await get_rows(page)
                                  for r in nr: seen['|'.join(r[:5])]=r
                              print('WHEEL_UNIQUE',direction,len(seen),flush=True)
                      await page.close()
                  await ctx.close(); await b.close()

          asyncio.run(main())
          PY
